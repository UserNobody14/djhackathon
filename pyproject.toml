[project]
name = "hackathon-p"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Benjamin Sobel", email = "ben-developer@opayq.com" }
]
dependencies = [
    "fastapi[standard]>=0.115.7",
    "pydantic>=2.10.6",
    "requests>=2.32.3",
    "openai>=1.60.1",
    "langchain>=0.3.15",
    "langchain-openai>=0.3.2",
    "python-dotenv>=1.0.1",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "marimo>=0.10.17",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_p"]
